<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sharp Vivid Red Gradient -->
    <linearGradient id="lmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="100%" stop-color="#B30006"/>
    </linearGradient>

    <!-- Sleek Ambient Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF1E27" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="512" height="512" rx="120" fill="#FFFFFF"/>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="#F1F5F9" stroke-width="3"/>

  <!-- MONOGRAM "L" (Structured Black Academic / Foundation Leg) -->
  <path d="M 124 108 
           L 180 108 
           L 180 344 
           L 292 344 
           L 292 400 
           L 124 400 Z" 
        fill="#111111"/>

  <!-- MONOGRAM "M" (Active AI Synaptic Waves & Peak Structure) -->
  <!-- Left Neural Pillar of 'M' -->
  <path d="M 216 400 
           L 216 220 
           L 266 220 
           L 266 400 Z" 
        fill="#111111"/>

  <!-- Dynamic Red Brain Synapse Fold of 'M' -->
  <path d="M 266 220 
           L 332 328 
           L 398 220 
           L 446 220 
           L 446 400 
           L 392 400 
           L 392 300 
           L 348 370 
           L 316 370 
           L 266 288 Z" 
        fill="url(#lmRed)" 
        filter="url(#softGlow)"/>

  <!-- FLOATING AI SPEECH / INTELLIGENCE SYNAPSE NODES -->
  <!-- Audio Spark Apex -->
  <circle cx="332" cy="144" r="18" fill="url(#lmRed)"/>
  <circle cx="332" cy="144" r="7" fill="#FFFFFF"/>

  <!-- Dynamic Signal Rays (Lecture Sound & Thought Wave) -->
  <path d="M 276 144 C 276 113 301 88 332 88" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <path d="M 332 88 C 363 88 388 113 388 144" fill="none" stroke="url(#lmRed)" stroke-width="7" stroke-linecap="round"/>

  <!-- Outer Satellite Synapse Nodes -->
  <circle cx="446" cy="154" r="10" fill="url(#lmRed)"/>
  <circle cx="218" cy="154" r="10" fill="#111111"/>

  <!-- Interconnecting Circuit Beams -->
  <line x1="347" y1="151" x2="436" y2="154" stroke="url(#lmRed)" stroke-width="3.5" stroke-dasharray="6 5"/>
  <line x1="228" y1="154" x2="317" y2="151" stroke="#111111" stroke-width="3.5" stroke-dasharray="6 5"/>
  <line x1="332" y1="162" x2="332" y2="328" stroke="#FFFFFF" stroke-width="4"/>
</svg>
